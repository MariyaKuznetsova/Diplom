{% extends 'diary/base.html' %}
{% load my_tags %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-6 row-cols-sm-6 row-cols-md-3 g-3">
            {% for record in object_list %}
            <div class="col-12">
                <div class="card shadow-sm">
                    <img src="{{ record.image }}" style="max-width: 100%; height: 250px;"></div>
                    <div class="card-body">
                        <p class="card-text"><input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com"></p>
                        <p class="card-text">{{ record.contents|truncatechars:100 }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="col-12">
                                {% csrf_token %}
                                <a class="btn btn-primary" href="{% url 'diary:record_detail' record.pk %}" role="article">Посмотреть</a>
                                <a class="btn btn-primary" href="{% url 'diary:record_image' %}" role="article">Фотографии</a>
                                {% if user == record.owner %}
                                <a class="btn btn-primary" href="{% url 'diary:record_update' record.pk %}" role="article">Редактировать</a>
                                </div>
                                <div class="col-5">
                                    <a class="btn btn-danger" href="{% url 'diary:record_delete' record.pk %}" role="article">Удалить</a>
                                {% endif %}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
