{% extends 'diary/base.html' %}
{% load my_tags %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-1 row-cols-md-1 g-3">
            <div class="col">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <p class="card-text"><img src="{{ object.image | media_filter }}" style="max-width: 100%; height: 250px;"></p>
                        <p class="card-text">Дата: {{ object.date }}</p>
                        <p class="card-text">Содержание: {{ object.contents }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="col">
                                <a class="btn btn-primary" href="{% url 'diary:record_list' %}" role="article">Назад</a>
                                <a class="btn btn-primary" href="{% url 'diary:record_update' record.pk %}" role="article">Редактировать</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
