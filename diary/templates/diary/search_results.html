{% extends 'diary/base.html' %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-1 row-cols-md-1 g-3">
            <div class="col">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <form method="get">
                            {{ form.as_p }}
                            <input type="submit" value="Найти">
                        </form>
                        {% if query %}
                        <h3>Результаты для "{{ query }}"</h3>
                        {% for item in results %}
                        <p>{{ item.date }}</p>
                        <p>{{ item.contents }}</p>
                        <p><img src="{{ item.image.url }}" style="max-width: 100%; height: 250px;"></p>
                        {% empty %}
                        <p>Ничего не найдено</p>
                        {% endfor %}
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
