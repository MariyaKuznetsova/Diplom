#            context: nginx/
#        ports:
#            - "80:80"
#        volumes:
#            - ./nginx/nginx.conf:/etc/nginx/nginx.conf
#        depends_on:
#            - web

    web:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: diplom
        command:
            bash -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
        ports:
            - "8000:8000"
        env_file:
            - ./.env
        volumes:
            - .:/code
            - static_volume:/code/static
        depends_on:
            - db
            - redis

    db:
        image: postgres:17
        container_name: postgres_db_diplom
        env_file:
            - ./.env
        ports:
          - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data


networks:
    app_network:
        driver: bridge
volumes:
    postgres_data:
    static_volume:




