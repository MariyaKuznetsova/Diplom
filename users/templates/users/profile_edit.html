{% extends 'diary/base.html' %}
{% load my_tags %}
{% block content %}
<div class="container mt-8">
    <form class="row" method="post" enctype="multipart/form-data">
        <div class="col-6">
            <div class="card">
                <div class="card-body">
                    {% csrf_token %}
                    {{ form.as_p }}

                    <div class="col-6">
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                        <a href="{% url 'users:profile' %}" class="btn btn-danger">Отмена</a>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}
